version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
    ignore:
      # Vendored and patched copy; update manually (see vendor/unrar/PATCHES.md).
      - dependency-name: unrar
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
