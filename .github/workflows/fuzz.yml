# Fuzzing of the parsers of untrusted input, every week and on demand.
# libFuzzer on MSVC needs AddressSanitizer, whose DLL ships with the build tools.
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [par2_names, sfv_text, names]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: AddressSanitizer runtime on PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dll = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Select-Object -First 1
          if (-not $dll) { throw "AddressSanitizer runtime not found" }
          Split-Path $dll | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Run
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- "-max_total_time=$env:SECONDS_PER_TARGET"
        shell: pwsh

      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
