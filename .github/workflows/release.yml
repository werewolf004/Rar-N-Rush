# Release: on a `vX.Y.Z` tag, run the full checks, build the Windows binary and
# publish a GitHub release whose notes are the matching CHANGELOG.md section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != Cargo.toml v$version" }

      - name: Checks
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "rar-n-rush-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/rar-n-rush.exe, LICENSE-MIT, LICENSE-APACHE, README.md, README.fr.md, CHANGELOG.md, CHANGELOG.fr.md $name
          Copy-Item docs/THIRD-PARTY-LICENSES.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      # Signed SLSA build provenance: anyone can check that the zip was built by
      # this workflow from this tag with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rar-n-rush-${{ github.ref_name }}-windows-x64.zip
            target/release/rar-n-rush.exe

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "No CHANGELOG.md section for $version" }
          $rest = $lines[$start..($lines.Length - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body += ""
          $body += "Full changelog: [English](CHANGELOG.md) · [Français](CHANGELOG.fr.md)"
          $body | Out-File -Encoding utf8 notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: |
            rar-n-rush-${{ github.ref_name }}-windows-x64.zip
            rar-n-rush-${{ github.ref_name }}-windows-x64.zip.sha256
