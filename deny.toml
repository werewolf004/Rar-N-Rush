# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with "MIT OR Apache-2.0".
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Rar N Rush never goes online: no update check, no telemetry. Any HTTP/TLS/async
# networking crate entering the dependency graph fails the build.
deny = [
    { crate = "reqwest", reason = "no network access by design" },
    { crate = "ureq", reason = "no network access by design" },
    { crate = "hyper", reason = "no network access by design" },
    { crate = "curl", reason = "no network access by design" },
    { crate = "isahc", reason = "no network access by design" },
    { crate = "attohttpc", reason = "no network access by design" },
    { crate = "rustls", reason = "no network access by design" },
    { crate = "native-tls", reason = "no network access by design" },
    { crate = "openssl", reason = "no network access by design" },
    { crate = "tokio", reason = "no network access by design" },
    { crate = "self_update", reason = "no update check by design" },
    { crate = "self-replace", reason = "no update check by design" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
