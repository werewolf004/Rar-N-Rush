# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
# Fail on any RustSec advisory (vulnerability, unmaintained, unsound, yanked).
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with "MIT OR Apache-2.0".
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
