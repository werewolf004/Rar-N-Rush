[package]
name = "rar-n-rush"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Watches a download folder, verifies PAR2/SFV sets, repairs them and extracts RAR archives automatically."
license = "MIT OR Apache-2.0"
repository = "https://github.com/werewolf004/Rar-N-Rush"
readme = "README.md"
keywords = ["rar", "par2", "sfv", "extract", "usenet"]
categories = ["compression", "gui"]
publish = false

[lib]
name = "rar_n_rush"
path = "src/lib.rs"

[[bin]]
name = "rar-n-rush"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crc32fast = "1"
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
keyring-core = "1.0.1"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2"
toml = "1"
trash = "5"
tray-icon = { version = "0.26", default-features = false }
unrar = "0.5"
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

# Patched copy of the `unrar` crate 0.5.8 (out-of-bounds read on volume change).
# See SECURITY.md and vendor/unrar/PATCHES.md.
[patch.crates-io]
unrar = { path = "vendor/unrar" }
